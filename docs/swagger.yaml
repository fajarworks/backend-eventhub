basePath: /
definitions:
  dto.AdminOverview:
    properties:
      avg_fill_rate:
        type: integer
      total_community:
        type: integer
      total_event:
        type: integer
      total_user:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: maruf321@mail.com
        type: string
      password:
        example: moonchaser1234
        type: string
    required:
    - email
    - password
    type: object
  dto.OrganizerStats:
    properties:
      avg_fill_rate:
        type: integer
      total_attendees:
        type: integer
      total_events:
        type: integer
    type: object
  dto.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      fullname:
        maxLength: 255
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - fullname
    - password
    type: object
  dto.Response:
    properties:
      data: {}
      message:
        type: string
      status:
        type: boolean
    type: object
host: localhost:8081
info:
  contact: {}
  description: Aplication for eventhub API
  title: Eventhub
  version: "1.0"
paths:
  /admin/overview:
    get:
      consumes:
      - application/json
      description: Retrieves overview data for the admin dashboard (platform-wide
        summary statistics). Requires authentication and admin role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdminOverview'
              type: object
        "401":
          description: Unauthorized - token is missing, invalid, or expired
          schema:
            $ref: '#/definitions/dto.Response'
        "403":
          description: Forbidden - user is not an admin
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Get admin dashboard overview
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: login to access all features app
      parameters:
      - description: login woi
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Login to authentication
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with fullname, email, and password.
        Email must be unique and in a valid format.
      parameters:
      - description: Registration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Invalid request body, empty field, or invalid email format
          schema:
            $ref: '#/definitions/dto.Response'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Register a new user
      tags:
      - Auth
  /communities/{id}/join:
    post:
      consumes:
      - application/json
      description: Allows the authenticated user to join a community
      parameters:
      - description: Community ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Join a community
      tags:
      - Community
  /communities/{id}/leave:
    delete:
      consumes:
      - application/json
      description: Allows the authenticated user to leave a community
      parameters:
      - description: Community ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Leave a community
      tags:
      - Community
  /communities/popular:
    get:
      consumes:
      - application/json
      description: Get Most Popular Communities
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      tags:
      - Community
  /events/{id}:
    get:
      description: get a detail information of an event
      parameters:
      - description: event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: retrieves an event detail
      tags:
      - Events
  /events/{id}/remove:
    delete:
      consumes:
      - application/json
      description: Allows the authenticated user to remove a saved event
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: remove saved a event
      tags:
      - Events
  /events/{id}/save:
    post:
      consumes:
      - application/json
      description: Allows the authenticated user to save an event
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: saved an event
      tags:
      - Events
  /organizer/create-event:
    post:
      consumes:
      - multipart/form-data
      description: Creates a new event with an uploaded image, and optionally assigns
        existing categories, existing speakers, and new speakers (as a JSON array
        string). Requires authentication as an organizer.
      parameters:
      - description: Event title
        in: formData
        name: title
        required: true
        type: string
      - description: Event description
        in: formData
        name: description
        type: string
      - description: Event location
        in: formData
        name: location
        required: true
        type: string
      - description: Maximum number of attendees
        in: formData
        name: capacity
        required: true
        type: integer
      - description: Event start time
        in: formData
        name: start_time
        required: true
        type: string
      - description: Event end time
        in: formData
        name: end_time
        required: true
        type: string
      - description: Community ID this event belongs to
        in: formData
        name: community_id
        type: integer
      - collectionFormat: multi
        description: Existing category IDs to assign
        in: formData
        items:
          type: integer
        name: categories
        type: array
      - collectionFormat: multi
        description: Existing speaker IDs to assign
        in: formData
        items:
          type: integer
        name: speakers
        type: array
      - description: '[{\'
        in: formData
        name: new_speakers
        type: string
      - description: Event cover image
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Event created successfully
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  properties:
                    eventId:
                      type: integer
                  type: object
              type: object
        "400":
          description: Invalid request body or new_speakers format
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized - please login first
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Create a new event
      tags:
      - Organizer
  /organizer/stats:
    get:
      consumes:
      - application/json
      description: Get statistic dashboard for organizer Authorized (total event,
        total attendee, and fill rate average).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrganizerStats'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Get organizer dashboard statistics
      tags:
      - Organizer
  /testimonials:
    get:
      description: get testimoanials for app
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: retrieves testimonials
      tags:
      - Testimonials
  /user/update:
    patch:
      consumes:
      - multipart/form-data
      description: Update information user
      parameters:
      - description: Profile photo
        in: formData
        name: photo_profile
        type: file
      - description: Full name
        in: formData
        name: fullname
        type: string
      - description: Job position
        in: formData
        name: job_position
        type: string
      - description: Location
        in: formData
        name: location
        type: string
      - description: Bio
        in: formData
        name: bio
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Update User Information
      tags:
      - User
securityDefinitions:
  BearerAuth:
    description: Bearer token used as identiity for accessing backend
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
